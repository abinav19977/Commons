name: Build Windows connector
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run connector regression tests
        run: python -m unittest discover -s connector -p 'test_*.py'
      - name: Install packaging tool
        run: python -m pip install PyInstaller==6.22.2
      - name: Build and smoke-test Windows package
        run: python connector/build_windows.py
      - name: Upload executable package for acceptance testing
        uses: actions/upload-artifact@v4
        with:
          name: commons-tally-windows-acceptance
          path: connector/release/*.zip
          if-no-files-found: error
          retention-days: 14
